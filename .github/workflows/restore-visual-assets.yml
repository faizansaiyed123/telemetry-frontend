name: Restore Telemetry walkthrough visuals

on:
  push:
    branches:
      - docs/restore-telemetry-visuals

permissions:
  contents: write
  actions: read

jobs:
  restore-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out temporary recovery branch
        uses: actions/checkout@v4

      - name: Download the successful full-stack Browser QA artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-qa-artifacts-comprehensive
          repository: ${{ github.repository }}
          run-id: 40185432838
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/browser-artifacts

      - name: Restore real screenshots and repair Markdown paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/testing/visuals
          cp /tmp/browser-artifacts/qa-artifacts/00-home.png docs/testing/visuals/01-homepage.png
          cp /tmp/browser-artifacts/qa-artifacts/14-final-dashboard.png docs/testing/visuals/02-live-dashboard.png
          cp /tmp/browser-artifacts/qa-artifacts/03-analytics.png docs/testing/visuals/03-analytics.png
          cp /tmp/browser-artifacts/qa-artifacts/04-hosts.png docs/testing/visuals/04-host-inventory.png
          cp /tmp/browser-artifacts/qa-artifacts/06-alerts-incidents.png docs/testing/visuals/05-alerts-incidents.png
          cp /tmp/browser-artifacts/qa-artifacts/07-changes.png docs/testing/visuals/06-change-events.png
          cp /tmp/browser-artifacts/qa-artifacts/09-notifications.png docs/testing/visuals/07-webhook-deliveries.png
          cp /tmp/browser-artifacts/qa-artifacts/10-synthetic-checks.png docs/testing/visuals/08-synthetic-check.png
          cp /tmp/browser-artifacts/qa-artifacts/12-operations.png docs/testing/visuals/09-operations-audit-trail.png
          cp /tmp/browser-artifacts/qa-artifacts/14-administration.png docs/testing/visuals/10-administration.png
          cp /tmp/browser-artifacts/qa-artifacts/16-settings.png docs/testing/visuals/11-account-settings.png
          cp /tmp/browser-artifacts/qa-artifacts/17-mobile-navigation.png docs/testing/visuals/12-mobile-navigation.png
          python - <<'PY'
          from pathlib import Path
          doc = Path("docs/testing/VISUAL-TEST-WALKTHROUGH.md")
          text = doc.read_text()
          text = text.replace(".jpg)", ".png)")
          doc.write_text(text)
          images = sorted(Path("docs/testing/visuals").glob("*.png"))
          if len(images) != 12:
              raise SystemExit(f"Expected 12 screenshots, found {len(images)}")
          for image in images:
              if image.stat().st_size < 1000:
                  raise SystemExit(f"Screenshot looks unexpectedly small: {image}")
          for line in doc.read_text().splitlines():
              if line.startswith("![") and "visuals/" in line:
                  target = line.split("visuals/", 1)[1].split(")", 1)[0]
                  if not (Path("docs/testing/visuals") / target).is_file():
                      raise SystemExit(f"Broken screenshot reference: {target}")
          PY

      - name: Commit screenshots and remove the temporary recovery workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/VISUAL-TEST-WALKTHROUGH.md docs/testing/visuals
          git commit -m "docs: restore visual walkthrough screenshots"
          git push origin HEAD
          git rm .github/workflows/restore-visual-assets.yml
          git commit -m "chore: remove temporary screenshot recovery workflow"
          git push origin HEAD
