name: End-to-End Browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-e2e-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Real browser end-to-end QA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: telemetry
          POSTGRES_USER: telemetry
          POSTGRES_PASSWORD: telemetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telemetry -d telemetry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/telemetry-backend
          ref: fe6adac9603f32fd898850c73bf0b23a41ef7246
          path: backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0 pytest==8.4.1 pytest-asyncio==1.2.0
          python -m playwright install --with-deps chromium

      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://telemetry:telemetry@localhost:5432/telemetry
          APP_ENV: development
        run: uv run alembic upgrade head

      - name: Start backend
        working-directory: backend
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg://telemetry:telemetry@localhost:5432/telemetry
          BOOTSTRAP_ADMIN_EMAIL: qa-admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD: QaAdmin!12345
          TELEMETRY_PERSISTENCE_ENABLED: "true"
          TELEMETRY_RATE: "10"
          MAX_TELEMETRY_RATE: "100"
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Start frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat frontend.log
          exit 1

      - name: Run real-user browser QA
        env:
          QA_BASE_URL: http://127.0.0.1:5173
          QA_API_URL: http://127.0.0.1:8000
          QA_ADMIN_EMAIL: qa-admin@example.com
          QA_ADMIN_PASSWORD: QaAdmin!12345
          QA_ARTIFACT_DIR: qa-artifacts
        run: pytest -q -s qa/e2e/test_full_application.py --tb=short

      - name: Upload QA screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-e2e-qa-artifacts
          path: |
            qa-artifacts/
            backend.log
            frontend.log
            backend.pid
            frontend.pid
