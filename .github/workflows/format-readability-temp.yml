name: Temporary formatting pass

on:
  push:
    branches:
      - chore/formatting-only-readability
    paths:
      - .github/workflows/format-readability-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@v4
        with:
          ref: chore/formatting-only-readability
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format existing frontend source only
        run: |
          npx --yes prettier@3.3.3 --write "src/**/*.{ts,tsx,css}" "tests/**/*.ts" "index.html" "vite.config.ts"

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests index.html vite.config.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format frontend code for readability only"
            git push origin chore/formatting-only-readability
          else
            echo "All selected files already match Prettier formatting."
          fi
