name: Browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: End-to-end browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: telemetry
          POSTGRES_PASSWORD: telemetry
          POSTGRES_DB: telemetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telemetry -d telemetry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://telemetry:telemetry@localhost:5432/telemetry
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      QA_BASE_URL: http://127.0.0.1:3000
      QA_API_URL: http://127.0.0.1:8000
      VITE_API_BASE_URL: http://127.0.0.1:8000
      QA_ADMIN_EMAIL: qa-admin@example.com
      QA_ARTIFACT_DIR: qa-artifacts

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/telemetry-backend
          path: backend

      - name: Generate ephemeral QA credentials
        shell: bash
        run: |
          QA_PASSWORD="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(24))
          PY
          )"
          JWT_SECRET="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          echo "QA_ADMIN_PASSWORD=$QA_PASSWORD" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_EMAIL=qa-admin@example.com" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$QA_PASSWORD" >> "$GITHUB_ENV"
          echo "JWT_SECRET_KEY=$JWT_SECRET" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          working-directory: backend

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Apply backend migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Start backend
        working-directory: backend
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Wait for backend
        run: |
          python - <<'PY'
          import time
          import urllib.request
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(2)
          raise SystemExit("Backend readiness check timed out")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Start frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Wait for frontend
        run: |
          python - <<'PY'
          import time
          import urllib.request
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:3000", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(2)
          raise SystemExit("Frontend readiness check timed out")
          PY

      - name: Install browser test dependencies
        run: python -m pip install pytest playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run real-user browser journey
        run: pytest -q qa/e2e -m e2e

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-artifacts
          path: |
            qa-artifacts/
            frontend.log
            backend.log
